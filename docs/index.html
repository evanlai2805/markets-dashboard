<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Asset Macro Monitor</title>
<meta name="description" content="Daily cross-asset macro monitor: US rates and curve, global government yields, inflation and real yields, credit spreads by tier, FX, commodities, equity rotation and Singapore rates. Data from FRED, OECD, MAS and OANDA via a public Google Sheet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---- tokens (Beautiful-UI, light = :root, dark mirrors every name) ---- */
:root{
  --page:#fafafb;--canvas:#f1f2f3;--surface:#fff;--inset:#f7f8f9;--hover:#f4f5f6;--hover-2:#e7e9eb;
  --ink:#1f2124;--ink-2:#62656b;--ink-3:#9a9da3;--line:#ecedef;--line-strong:#e0e2e5;--field:#f2f2f3;
  --accent:#0285ff;--accent-ink:#0170dd;--accent-tint:#e9f3ff;
  --green:#189a4d;--green-tint:#e8f5ed;--orange:#ef720c;--orange-tint:#fdf1e5;--red:#e3474c;--red-tint:#fcecec;
  --tooltip-bg:#25272b;--tooltip-fg:#f6f7f8;--tooltip-muted:#a5a8ad;--tooltip-border:#3a3c40;
  --shadow-btn:0 0 0 1px var(--line-strong),0 1px 2px #1018280d;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px #1018280a,0 2px 6px #10182808;
  --shadow-overlay:0 0 0 1px var(--line),0 8px 28px #0001;
  --radius-card:10px;--radius-control:8px;--radius-chip:6px;--radius-pill:999px;
  --font-ui:Inter,"Inter Fallback",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  /* chart palette (dataviz reference instance) */
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s7:#4a3aa7;--grid:#e1e0d9;--axis:#c3c2b7;--wash:#2a78d61a;
  color-scheme:light;
}
[data-theme="dark"]{
  --page:#17181a;--canvas:#1c1d1f;--surface:#232427;--inset:#1f2022;--hover:#2a2b2e;--hover-2:#313236;
  --ink:#f2f3f4;--ink-2:#a5a8ad;--ink-3:#6c6f75;--line:#2e3033;--line-strong:#3a3c40;--field:#2b2c2f;
  --accent:#3d9aff;--accent-ink:#7ec0ff;--accent-tint:#3d9aff29;
  --green:#3dbb72;--green-tint:#3dbb7224;--orange:#f68f3c;--orange-tint:#f68f3c24;--red:#ee5c61;--red-tint:#ee5c6124;
  --tooltip-bg:#111214;--tooltip-fg:#f2f3f4;--tooltip-muted:#a5a8ad;--tooltip-border:#2e3033;
  --shadow-btn:0 0 0 1px var(--line-strong),0 1px 2px #0000004d;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px #0003,0 2px 6px #0003;
  --shadow-overlay:0 0 0 1px var(--line-strong),0 8px 28px #00000057;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s7:#9085e9;--grid:#2c2c2a;--axis:#383835;--wash:#3987e526;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --page:#17181a;--canvas:#1c1d1f;--surface:#232427;--inset:#1f2022;--hover:#2a2b2e;--hover-2:#313236;
  --ink:#f2f3f4;--ink-2:#a5a8ad;--ink-3:#6c6f75;--line:#2e3033;--line-strong:#3a3c40;--field:#2b2c2f;
  --accent:#3d9aff;--accent-ink:#7ec0ff;--accent-tint:#3d9aff29;
  --green:#3dbb72;--green-tint:#3dbb7224;--orange:#f68f3c;--orange-tint:#f68f3c24;--red:#ee5c61;--red-tint:#ee5c6124;
  --tooltip-bg:#111214;--tooltip-fg:#f2f3f4;--tooltip-muted:#a5a8ad;--tooltip-border:#2e3033;
  --shadow-btn:0 0 0 1px var(--line-strong),0 1px 2px #0000004d;
  --shadow-card:0 0 0 1px var(--line),0 1px 2px #0003,0 2px 6px #0003;
  --shadow-overlay:0 0 0 1px var(--line-strong),0 8px 28px #00000057;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s7:#9085e9;--grid:#2c2c2a;--axis:#383835;--wash:#3987e526;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent-ink);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 56px}
.num{font-variant-numeric:tabular-nums}
.ink2{color:var(--ink-2)} .ink3{color:var(--ink-3)}
.up{color:var(--green)} .down{color:var(--red)} .flat{color:var(--ink-3)}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:500}
.hidden{display:none!important}

/* ---- header ---- */
.hdr{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;padding:14px 0 10px}
.hdr h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.hdr .fresh{font-size:12px;color:var(--ink-2)}
.hdr .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{font-size:13px;font-weight:500;padding:6px 12px;border-radius:var(--radius-control);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-btn)}
.btn:hover{background:var(--hover)}
.chip{display:inline-flex;gap:6px;align-items:center;padding:1px 8px;border-radius:var(--radius-chip);font-size:11px;font-weight:500;white-space:nowrap}
.chip i{width:6px;height:6px;border-radius:var(--radius-pill);background:currentColor;display:inline-block}
.chip--green{background:var(--green-tint);color:var(--green)} .chip--orange{background:var(--orange-tint);color:var(--orange)}
.chip--red{background:var(--red-tint);color:var(--red)} .chip--blue{background:var(--accent-tint);color:var(--accent-ink)}
.chip--grey{background:var(--inset);color:var(--ink-2)}
.banner{margin:8px 0;padding:10px 14px;border-radius:var(--radius-control);background:var(--orange-tint);color:var(--orange);font-size:13px}
.banner.err{background:var(--red-tint);color:var(--red)}

/* ---- tabs ---- */
.tabs{position:sticky;top:0;z-index:5;background:var(--page);padding:6px 0 10px}
.seg{display:inline-flex;gap:2px;padding:4px;background:var(--inset);border-radius:var(--radius-pill);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{flex:0 0 auto;padding:6px 14px;border-radius:var(--radius-pill);font-size:13px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-btn)}
.view{display:none} .view.on{display:block}

/* ---- layout & cards ---- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:14px 16px;min-width:0}
.card h2{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.card h2 small{font-weight:400;color:var(--ink-3);font-size:11px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media (max-width:860px){.c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12}}
.inset{background:var(--inset);border-radius:var(--radius-control);padding:10px 12px}
.section{margin:18px 0 8px}
.section .label{font-size:12px}
.scroll{overflow-x:auto;scrollbar-width:thin}

/* ---- tape / tiles ---- */
.tape{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));margin:8px 0 4px}
.tile{background:var(--surface);border-radius:var(--radius-control);box-shadow:var(--shadow-card);padding:8px 10px;min-width:0;cursor:pointer}
.tile:hover{background:var(--hover)}
.tile .k{font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:6px}
.tile .v{font-size:18px;font-weight:600;letter-spacing:-.01em;margin-top:1px}
.tile .d{font-size:11px;display:flex;gap:8px;flex-wrap:wrap}
.tile .sub{font-size:11px;color:var(--ink-2);margin-top:2px}

/* ---- tables ---- */
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--ink-3);text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.03em}
td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;color:var(--ink-2)}
th:first-child,td:first-child{text-align:left}
td:first-child{color:var(--ink)}
td.num{font-variant-numeric:tabular-nums}
tr.row{cursor:pointer} tr.row:hover td{background:var(--hover)}
tr.sel td{background:var(--accent-tint)}
tr.grp td{background:var(--inset);color:var(--ink-2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:4px 8px}
td.spark svg,td.range svg{display:block}
td.stale{color:var(--ink-3)}
.mini{font-size:11px;color:var(--ink-3)}

/* ---- charts ---- */
svg.chart{width:100%;height:auto;display:block;font-family:var(--font-ui)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin:2px 0 6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.tip{position:fixed;z-index:20;pointer-events:none;background:var(--tooltip-bg);color:var(--tooltip-fg);border:1px solid var(--tooltip-border);border-radius:var(--radius-control);padding:6px 9px;font-size:12px;box-shadow:var(--shadow-overlay);max-width:260px}
.tip .m{color:var(--tooltip-muted)}
.small-multiples{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.small-multiples .card{padding:10px 12px}

/* ---- notes / read ---- */
.read{margin-top:10px;padding:10px 12px;background:var(--inset);border-radius:var(--radius-control);font-size:13px;color:var(--ink)}
.read b{color:var(--accent-ink);font-weight:600}
.read .date{color:var(--ink-3);font-size:11px;margin-left:6px}
.state{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;font-size:13px}
.state .k{color:var(--ink-3);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding-top:1px}
.note{font-size:12px;color:var(--ink-3);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink)}

/* ---- modal ---- */
.modal{position:fixed;inset:0;z-index:30;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal .box{background:var(--surface);border-radius:var(--radius-card);box-shadow:var(--shadow-overlay);padding:16px 18px;max-width:640px;width:100%}
.modal h3{margin:0 0 6px;font-size:15px}
.modal .x{float:right}

/* ---- footer ---- */
.foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3)}
@media (max-width:480px){ .tile .v{font-size:16px} .state{grid-template-columns:1fr} th,td{padding:4px 6px} }
@media (prefers-reduced-motion:no-preference){ .view.on{animation:fade .16s ease-out} }
@keyframes fade{from{opacity:.5}to{opacity:1}}
</style>
</head>
<body>

  </div>
  <div id="banner"></div>
  <div class="tabs"><div class="seg" role="tablist" id="tabs"></div></div>
  <main id="main"></main>

</div>
<div class="tip hidden" id="tip"></div>

<script>
(function(){
'use strict';
/* =====================================================================================

   ===================================================================================== */
const SHEET_ID = '1xaAF9PcQm51QEUD-6nGWGHNSrRzK3AVyA1PN_Rk4YY4';
const SCHEMA_VERSION = '5';
const LIVE_REFRESH_MS = 10*60*1000;
const P = new URLSearchParams(location.search);
const FIXTURES = P.get('fixtures');                 // ?fixtures=../fixtures  → offline dev against CSV fixtures
const TZ_LABEL = 'SGT';

// curve tenors: [label, years, nominal id, real id | null]
const TENORS = [['1M',1/12,'DGS1MO'],['3M',.25,'DGS3MO'],['6M',.5,'DGS6MO'],['1Y',1,'DGS1'],['2Y',2,'DGS2'],['3Y',3,'DGS3'],

const SPREADS = [['2s10s','US_10Y_2Y'],['3m10y','US_10Y_3M'],['5s30s','US_5Y_30Y'],['10s30s','US_10Y_30Y'],['2s30s','US_2Y_30Y'],['20s30s','US_20Y_30Y']];
const OAS = [['IG (Corp Master)','BAMLC0A0CM'],['AAA','BAMLC0A1CAAA'],['AA','BAMLC0A2CAA'],['A','BAMLC0A3CA'],['BBB','BAMLC0A4CBBB'],['IG 1–3y','BAMLC1A0C13Y'],
             ['HY (Master II)','BAMLH0A0HYM2'],['BB','BAMLH0A1HYBB'],['B','BAMLH0A2HYB'],['CCC & lower','BAMLH0A3HYC'],['Euro HY','BAMLHE00EHYIOAS'],['EM corporate','BAMLEMCBPIOAS']];
const GLOBAL = [['United States','US','G10Y_US',null],['Germany','DE','G10Y_DE','G10Y_DE_US'],['United Kingdom','GB','G10Y_GB','G10Y_GB_US'],['Japan','JP','G10Y_JP','G10Y_JP_US'],
                ['Australia','AU','G10Y_AU','G10Y_AU_US'],['Canada','CA','G10Y_CA','G10Y_CA_US'],['Italy','IT','G10Y_IT','G10Y_IT_US'],['France','FR','G10Y_FR','G10Y_FR_US'],

// stat-table item: [id, label, decimals, unit]  unit: '%'|'bp'|'$'|''|'k'|'idx'
const PANELS = {

  spreads:    [['US_10Y_2Y','2s10s',2,'sp'],['US_10Y_3M','3m10y',2,'sp'],['US_5Y_30Y','5s30s',2,'sp'],['US_10Y_30Y','10s30s',2,'sp'],['US_2Y_30Y','2s30s',2,'sp'],['US_20Y_30Y','20s30s',2,'sp']],
  policy:     [['DFF','Fed funds effective',2,'%'],['DFEDTARU','Target range upper',2,'%'],['DFEDTARL','Target range lower',2,'%'],['SOFR','SOFR',2,'%'],['POLICY_PROXY_6M','Policy proxy: 6m bill − funds ◌',2,'sp'],['POLICY_PROXY_1Y','Policy proxy: 1y − funds ◌',2,'sp']],
  liquidity:  [['WALCL','Fed balance sheet $bn',0,'$'],['RRPONTSYD','ON RRP $bn',0,'$'],['WTREGEN','TGA $bn',0,'$'],['Net_Liquidity','Net liquidity $bn',0,'$'],['M2SL','M2 $bn',0,'$']],
  real:       [['DFII5','5y real (TIPS)',2,'%'],['DFII7','7y real (TIPS)',2,'%'],['DFII10','10y real (TIPS)',2,'%'],['DFII20','20y real (TIPS)',2,'%'],['DFII30','30y real (TIPS)',2,'%']],
  be:         [['T5YIE','5y breakeven (print)',2,'%'],['T10YIE','10y breakeven (print)',2,'%'],['BE_5Y','5y BE = nominal − real',2,'%'],['BE_10Y_CALC','10y BE = nominal − real',2,'%'],['BE_30Y','30y BE = nominal − real',2,'%'],['T5YIFR','5y5y forward inflation',2,'%']],
  inflprints: [['CPIAUCSL','CPI YoY %',1,'pp'],['CPILFESL','Core CPI YoY %',1,'pp'],['PCEPILFE','Core PCE YoY %',1,'pp']],
  creditrisk: [['HY_IG_OAS','HY − IG',2,'sp'],['BAMLH0A0HYM2EY','HY effective yield',2,'%'],['BAMLC0A0CMEY','IG effective yield',2,'%'],['VIXCLS','VIX',1,''],['NFCI','Chicago Fed NFCI',2,''],['ANFCI','Adjusted NFCI',2,'']],
  fx:         [['DXY','US Dollar Index',2,'idx'],['DTWEXBGS','Broad USD (Fed)',2,'idx'],['DEXUSEU','EURUSD',4,''],['DEXUSUK','GBPUSD',4,''],['DEXJPUS','USDJPY',2,''],['DEXSZUS','USDCHF',4,''],['DEXCAUS','USDCAD',4,''],['DEXUSAL','AUDUSD',4,''],['DEXSDUS','USDSEK',4,'']],
  fxasia:     [['DEXSIUS','USDSGD (Fed H.10)',4,''],['USDSGD_OANDA','USDSGD (OANDA close)',4,''],['DEXCHUS','USDCNY',3,'']],
  cmdty:      [['GOLD','Gold $/oz',0,'$'],['COPPER','Copper $/lb',2,'$'],['CopperGold','Copper/Gold ×1000',3,''],['DCOILWTICO','WTI $/bbl',2,'$'],['DCOILBRENTEU','Brent $/bbl',2,'$']],
  crypto:     [['BTCUSD','Bitcoin',0,'$'],['ETHUSD','Ether',0,'$'],['ETH_BTC','ETH/BTC',4,'']],
  sgrates:    [['SORA_ON','SORA overnight',2,'%'],['SORA_1M','1M compounded SORA',2,'%'],['SORA_3M','3M compounded SORA',2,'%'],['SORA_6M','6M compounded SORA',2,'%'],['SG_SF_DEPO','MAS SF deposit (floor)',2,'%'],['SG_SF_BORR','MAS SF borrow (ceiling)',2,'%'],['SORA_VOL','SORA volume',0,'']],
  sgbills:    [['TBILL_6M','6M T-bill cut-off',2,'%'],['TBILL_1Y','1Y T-bill cut-off',2,'%'],['TBILL_6M_BTC','6M bid-to-cover',2,''],['SGS_2Y','SGS 2y',2,'%'],['SGS_10Y','SGS 10y',2,'%']],
  macro:      [['ICSA','Initial claims (k)',0,'k'],['PAYEMS','Nonfarm payrolls (k)',0,'k'],['UNRATE','Unemployment %',1,'pp'],['CPIAUCSL','CPI YoY %',1,'pp'],['CPILFESL','Core CPI YoY %',1,'pp'],['PCEPILFE','Core PCE YoY %',1,'pp']],
};
const TABS = [['board','Board'],['rates','Rates'],['credit','Credit'],['fx','FX'],['cmdty','Commodities'],['equities','Equities'],['macro','Macro'],['method','Methodology']];

/* ===================================================================================== data layer */
const D = { stats:{}, order:[], series:null, live:{}, liveMeta:{}, ratios:[], ratiosHist:null, notes:{}, meta:{}, sm:{} };
function parseCsv(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; } else if(c!=='\r') f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
// gviz answers a request for a MISSING tab with the first sheet, not an error — so every tab is
// verified by its expected first header cell and treated as missing if it does not match.
const TAB_HEAD = { DashStats:'series_id', DashSeries:'Date', Live:'group', RatiosLatest:'group', Ratios:'Date', Notes:'key', Meta:'key', Series:'series_id', Health:'series_id' };
async function tab(name, tq){
  let url;
  if(FIXTURES) url = FIXTURES.replace(/\/$/,'')+'/'+name+'.csv';
  else url = 'https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:csv&headers=1&sheet='+encodeURIComponent(name)+(tq?'&tq='+encodeURIComponent(tq):'')+'&_='+Date.now();
  const r = await fetch(url); if(!r.ok) throw new Error(name+': HTTP '+r.status);
  const t = await r.text(); if(t.trimStart().startsWith('<')) throw new Error(name+': not a CSV (tab missing or sheet not public)');
  const rows = parseCsv(t); const want = TAB_HEAD[name];
  if(want && (!rows[0] || String(rows[0][0]).trim() !== want)) throw new Error(name+': tab missing (gviz returned another sheet)');
  return rows;
}
const num = v => { if(v==null||v==='') return null; const x=parseFloat(String(v).replace(/[%,$]/g,'')); return isFinite(x)?x:null; };
function loadStats(rows){
  const h=rows[0]; const ix=Object.fromEntries(h.map((k,i)=>[k,i])); const sI=ix['s1'];
  const extI = { v1m:ix['v1m'], v1y:ix['v1y'], pct3y:ix['pct3y'], cadence:ix['cadence'], status:ix['status'] };
  rows.slice(1).forEach(r=>{ const id=r[0]; if(!id) return;
    const spark=[]; for(let k=0;k<60;k++){ const v=num(r[sI+k]); if(v!=null) spark.push(v); }

  const roll=nxt&&nxt.last!=null?(s.last-nxt.last)*100:null; const carry=ff&&ff.last!=null?(s.last-ff.last)*100:null;
  let h='<div style="font-size:22px;font-weight:600;letter-spacing:-.01em" class="num">'+selTenor+' · '+fmt(s.last,2)+'%</div><dl class="kv">'+
   '<dt>1d / 1m / 1y</dt><dd class="num"><span class="'+cls(s.d1)+'">'+bp(s.d1)+'</span> / <span class="'+cls(chgBp(s))+'">'+bp(chgBp(s))+'</span> / <span class="'+cls(chgBp1y(s))+'">'+bp(chgBp1y(s))+'</span></dd>'+
   '<dt>1y range</dt><dd class="num">'+fmt(s.lo,2)+' – '+fmt(s.hi,2)+' · '+(s.pct==null?'—':Math.round(s.pct)+'th %ile')+'</dd>'+
   '<dt>Carry vs funds</dt><dd class="num '+cls(carry)+'">'+bp(carry)+'</dd><dt>Roll-down to '+(i>0?TENORS[i-1][0]:'—')+'</dt><dd class="num">'+bp(roll)+'</dd>';
  if(r&&r.last!=null){ h+='<dt>Real (TIPS)</dt><dd class="num">'+fmt(r.last,2)+'% <span class="ink3">('+bp(chgBp(r))+' 1m)</span></dd><dt>Breakeven</dt><dd class="num">'+fmt(s.last-r.last,2)+'% <span class="ink3">('+(s.v1m!=null&&r.v1m!=null?bp((s.last-r.last-(s.v1m-r.v1m))*100):'—')+' 1m)</span></dd>'; }
  h+='<dt>As of</dt><dd>'+esc(s.asof)+' '+statusChip(s.status,null)+'</dd></dl>'+notes('rates.'+selTenor)+'<div class="note"><a href="#" data-prov="'+t[2]+'">Source &amp; definition</a></div>';
  return h; }
// horizontal ladder: today bar + 1m/1y ticks, in bp
function ladder(rows, opts={}){ const vals=rows.flatMap(r=>[r.now,r.m,r.yr]).filter(v=>v!=null); if(!vals.length) return '<div class="note">not yet in the sheet</div>';
  const W=560, rowH=26, H=rows.length*rowH+8, LBL=opts.lbl||120; const mn=Math.min(0,...vals)-8, mx=Math.max(0,...vals)+8; const X=v=>LBL+(W-LBL-70)*(v-mn)/(mx-mn); let g='<line x1="'+X(0).toFixed(1)+'" x2="'+X(0).toFixed(1)+'" y1="2" y2="'+(H-2)+'" stroke="var(--axis)"/>';
  rows.forEach((r,i)=>{ const y=i*rowH+6; g+='<text x="4" y="'+(y+13)+'" font-size="12" fill="var(--ink)">'+esc(r.label)+'</text>';
    if(r.now!=null){ g+='<rect x="'+Math.min(X(0),X(r.now)).toFixed(1)+'" y="'+(y+2)+'" width="'+Math.max(1,Math.abs(X(r.now)-X(0))).toFixed(1)+'" height="14" rx="3" fill="'+(r.color||'var(--s1)')+'"/><text x="'+(W-64)+'" y="'+(y+13)+'" font-size="12" font-weight="600" fill="var(--ink)" class="num">'+Math.round(r.now)+'</text>'; }
    if(r.m!=null) g+='<line x1="'+X(r.m).toFixed(1)+'" x2="'+X(r.m).toFixed(1)+'" y1="'+y+'" y2="'+(y+18)+'" stroke="var(--ink-3)" stroke-width="2"/>';
    if(r.yr!=null) g+='<line x1="'+X(r.yr).toFixed(1)+'" x2="'+X(r.yr).toFixed(1)+'" y1="'+y+'" y2="'+(y+18)+'" stroke="var(--s7)" stroke-width="2"/>';
    g+='<text x="'+(W-4)+'" y="'+(y+13)+'" font-size="10" text-anchor="end" fill="var(--ink-3)" class="num">'+(r.m==null?'':'1m '+Math.round(r.m))+'</text>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.title||'ladder')+'">'+g+'</svg><div class="legend"><span><i style="background:var(--s1)"></i>Today (bp)</span><span><i style="background:var(--ink-3)"></i>1m ago</span><span><i style="background:var(--s7)"></i>1y ago</span></div>'; }
// stacked real + breakeven = nominal
function beStack(){ const t=[['5Y','DGS5','DFII5'],['10Y','DGS10','DFII10'],['30Y','DGS30','DFII30']].map(([k,n,r])=>({k, nom:S(n), real:S(r)})).filter(x=>x.nom&&x.real&&x.nom.last!=null&&x.real.last!=null);
  if(!t.length) return '<div class="note">real yields not yet in the sheet</div>';
  const W=420,H=210,L=36,B=26,T=14; const ymax=Math.ceil(Math.max(...t.map(x=>x.nom.last))+0.5); const Y=v=>T+(H-T-B)*(1-v/ymax); let g='';
  for(let v=0;v<=ymax;v+=1) g+='<line x1="'+L+'" x2="'+(W-8)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)"/><text x="'+(L-5)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--ink-3)">'+v+'</text>';
  const slot=(W-L-16)/t.length; t.forEach((x,i)=>{ const bw=Math.min(90,slot*0.6); const cx=L+8+slot*i+slot/2; const real=x.real.last, nom=x.nom.last, be=nom-real;
    g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(real).toFixed(1)+'" width="'+bw+'" height="'+(Y(0)-Y(real)).toFixed(1)+'" fill="var(--s1)"/>';
    g+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+Y(nom).toFixed(1)+'" width="'+bw+'" height="'+Math.max(0,(Y(real)-Y(nom)-2)).toFixed(1)+'" fill="var(--s2)"/>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+(Y(nom)-6).toFixed(1)+'" font-size="12" font-weight="600" text-anchor="middle" fill="var(--ink)" class="num">'+nom.toFixed(2)+'</text>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+((Y(real)+Y(0))/2+4).toFixed(1)+'" font-size="11" text-anchor="middle" fill="#fff" class="num">'+real.toFixed(2)+'</text>';
    if(Y(real)-Y(nom)>16) g+='<text x="'+cx.toFixed(1)+'" y="'+((Y(nom)+Y(real))/2+4).toFixed(1)+'" font-size="11" text-anchor="middle" fill="#fff" class="num">'+be.toFixed(2)+'</text>';
    g+='<text x="'+cx.toFixed(1)+'" y="'+(H-B+16)+'" font-size="11" text-anchor="middle" fill="var(--ink-3)">'+x.k+'</text>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Nominal yield split into real yield and breakeven">'+g+'</svg><div class="legend"><span><i style="background:var(--s1)"></i>Real (TIPS)</span><span><i style="background:var(--s2)"></i>Breakeven = nominal − real</span></div>'; }
// Δnominal = Δreal + ΔBE, with shares, for 1m and 1y
function decomp(){ const n=S('DGS10'), r=S('DFII10'); if(!n||!r||n.v1m==null||r.v1m==null) return '<div class="note">not enough history yet</div>';
  const rows=[['1 month', (n.last-n.v1m)*100, (r.last-r.v1m)*100], ['1 year', n.v1y!=null&&r.v1y!=null?(n.last-n.v1y)*100:null, n.v1y!=null&&r.v1y!=null?(r.last-r.v1y)*100:null]].filter(x=>x[1]!=null);
  let h=''; rows.forEach(([w,dn,dr])=>{ const dbe=dn-dr; const tot=Math.abs(dr)+Math.abs(dbe); const rs=tot?Math.abs(dr)/tot:0.5; const W=400;
    const driver = Math.abs(dn)<3 ? 'flat' : (rs>0.6?'real-yield driven':(rs<0.4?'breakeven driven':'mixed'));
    h+='<div style="margin:6px 0 10px"><div style="display:flex;justify-content:space-between;font-size:13px"><span><b>'+w+'</b> · 10y nominal <span class="num '+cls(dn)+'">'+bp(dn)+'</span></span><span class="ink2">'+driver+'</span></div>'+
      '<svg viewBox="0 0 '+W+' 22" class="chart" style="margin:4px 0" aria-label="'+w+' decomposition"><rect x="0" y="6" width="'+(W*rs).toFixed(1)+'" height="10" rx="3" fill="var(--s1)"/><rect x="'+(W*rs+2).toFixed(1)+'" y="6" width="'+Math.max(0,W*(1-rs)-2).toFixed(1)+'" height="10" rx="3" fill="var(--s2)"/></svg>'+
      '<div style="display:flex;justify-content:space-between;font-size:12px" class="num"><span><i style="display:inline-block;width:10px;height:3px;background:var(--s1);vertical-align:middle;margin-right:5px"></i>Real <span class="'+cls(dr)+'">'+bp(dr)+'</span> · '+Math.round(rs*100)+'%</span><span>Breakeven <span class="'+cls(dbe)+'">'+bp(dbe)+'</span> · '+Math.round((1-rs)*100)+'%<i style="display:inline-block;width:10px;height:3px;background:var(--s2);vertical-align:middle;margin-left:5px"></i></span></div></div>'; });
  const be=S('BE_10Y_CALC'), pr=S('T10YIE'); if(be&&pr&&be.last!=null&&pr.last!=null){ const gap=(be.last-pr.last)*100; h+='<div class="note">Check: nominal − real = '+be.last.toFixed(2)+'% vs the T10YIE print '+pr.last.toFixed(2)+'% ('+bp(gap)+' gap'+(Math.abs(gap)>5?', <span class="down">above the 5bp tolerance — sources differ in method</span>':'')+').</div>'; }
  return h; }
// horizontal bars for levels (global 10y, OAS ladder)
function hbars(rows, opts={}){ const vals=rows.map(r=>r.v).filter(v=>v!=null); if(!vals.length) return '<div class="note">not yet in the sheet</div>';
  const W=560,rowH=24,H=rows.length*rowH+6,LBL=opts.lbl||130; const mx=Math.max(...vals)*1.05; const scale=(W-LBL-60)/mx; let g='';
  rows.forEach((r,i)=>{ const y=i*rowH+3; g+='<text x="4" y="'+(y+14)+'" font-size="12" fill="var(--ink)">'+esc(r.label)+(r.est?' ◌':'')+'</text>';
    if(r.v!=null){ g+='<rect x="'+LBL+'" y="'+(y+4)+'" width="'+Math.max(1,r.v*scale).toFixed(1)+'" height="14" rx="3" fill="'+(r.color||'var(--s1)')+'" opacity="'+(r.dim?0.55:1)+'"/><text x="'+(LBL+r.v*scale+6).toFixed(1)+'" y="'+(y+15)+'" font-size="11" fill="var(--ink)" class="num">'+(opts.fmt?opts.fmt(r.v):r.v.toFixed(2))+'</text>'; }
    else g+='<text x="'+(LBL+6)+'" y="'+(y+15)+'" font-size="11" fill="var(--ink-3)">—</text>'; });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.title||'bars')+'">'+g+'</svg>'; }

// rule-based state lines — the rules are published on the Methodology tab
function stateLines(){ const out=[]; const g=id=>S(id);
  const y2=g('DGS2'), y10=g('DGS10'), r10=g('DFII10'), be10=g('T10YIE'), s210=g('US_10Y_2Y');
  if(y2&&y10&&chgBp(y2)!=null&&chgBp(y10)!=null){ const d2=chgBp(y2), d10=chgBp(y10); const dir=(d2+d10)/2>5?'bear':((d2+d10)/2<-5?'bull':'sideways'); const shape=Math.abs(d10-d2)<5?'parallel':(d10-d2>0?'steepening':'flattening');
    let drv=''; if(r10&&chgBp(r10)!=null&&Math.abs(d10)>=5){ const rs=Math.abs(chgBp(r10))/(Math.abs(chgBp(r10))+Math.abs(d10-chgBp(r10))); drv=rs>0.6?'; real yields drive most of the move':(rs<0.4?'; breakevens drive most of the move':'; real and breakeven contributions are mixed'); }
    out.push(['Rates', dir==='sideways'?'Curve broadly unchanged over the month (2y '+bp(d2)+', 10y '+bp(d10)+')'+drv+'.':(dir+' '+shape+' over the month: 2y '+bp(d2)+', 10y '+bp(d10)+(s210?' → 2s10s '+bpAbs(s210.last*100):'')+drv+'.')]); }
  const ig=g('BAMLC0A0CM'), hy=g('BAMLH0A0HYM2'); if(ig&&hy&&chgBp(ig)!=null&&chgBp(hy)!=null){ const di=chgBp(ig), dh=chgBp(hy);
    const word=Math.abs(dh)<10&&Math.abs(di)<5?'Spreads contained':(dh>0?'HY widening '+(dh>2*Math.max(di,1)?'faster than IG':'with IG'):'HY tightening'); out.push(['Credit', word+' over the month: IG '+bp(di)+', HY '+bp(dh)+'; HY '+(hy.pct==null?'':Math.round(hy.pct)+'th 1y percentile')+'.']); }
  const dxy=g('DXY'); if(dxy&&dxy.d1m!=null&&y10){ const dd=dxy.d1m*100; const d10=chgBp(y10); out.push(['USD', 'Dollar index '+pctStr(dd,1)+' over the month'+(d10!=null?(dd>0.3&&d10>5?', firmer alongside Treasury yields':(dd<-0.3&&d10>5?', softer despite higher yields':(dd<-0.3&&d10<-5?', softer with yields':''))):'')+'.']); }
  const spx=D.live['S&P'], stil=D.live['STI']; if(spx&&spx.chg!=null){ let t='S&P 500 '+pctStr(spx.chg,2)+' vs previous close'; if(r10&&chgBp(r10)!=null) t+= (chgBp(r10)>10?'; equities '+(spx.chg>-0.5?'holding':'weaker')+' with real yields up '+bpAbs(chgBp(r10))+' on the month':''); if(stil&&stil.chg!=null) t+='; STI '+pctStr(stil.chg,2); out.push(['Equities', t+'.']); }
  const nl=g('Net_Liquidity'); if(nl&&nl.d1m!=null) out.push(['Liquidity', 'Fed net liquidity '+(nl.d1m>0?'+':'')+fmt(nl.d1m,0)+'bn over the month ('+(nl.d1m<-100?'draining':(nl.d1m>100?'adding':'flat'))+'); ON RRP '+(g('RRPONTSYD')?fmt(g('RRPONTSYD').last,0)+'bn':'—')+'.']);
  const gold=g('GOLD'), oil=g('DCOILWTICO'); if(gold&&oil&&gold.d1m!=null&&oil.d1m!=null) out.push(['Commodities', 'Gold '+pctStr(gold.d1m*100,1)+' and WTI '+pctStr(oil.d1m*100,1)+' over the month'+((gold.d1m>0)!==(oil.d1m>0)?', diverging':', moving together')+'.']);
  const sora=g('SORA_3M'), ff=g('DFF'); if(sora&&ff&&chgBp(sora)!=null&&chgBp(ff)!=null) out.push(['Singapore', '3M SORA '+bp(chgBp(sora))+' vs Fed funds '+bp(chgBp(ff))+' over the month; SORA '+bpAbs((sora.last-ff.last)*100)+' '+(sora.last<ff.last?'below':'above')+' funds.']);
  return out; }

function sparkBig(id){ const s=S(id); if(!s||!s.spark.length) return '<div class="note">not available</div>'; const a=s.spark; const W=560,H=160,L=40,R=12,T=12,B=8; const mn=Math.min(...a),mx=Math.max(...a); const X=i=>L+(W-L-R)*i/(a.length-1), Y=v=>T+(H-T-B)*(1-(v-mn)/(mx-mn||1)); let g='';
  niceTicks(mn,mx,3).forEach(v=>{ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--grid)"/><text x="'+(L-5)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="10" text-anchor="end" fill="var(--ink-3)">'+fmtTick(v)+'</text>'; });
  g+='<path d="'+a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')+'" fill="none" stroke="var(--s1)" stroke-width="2"/><circle cx="'+X(a.length-1).toFixed(1)+'" cy="'+Y(a[a.length-1]).toFixed(1)+'" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text x="'+(X(a.length-1)-8).toFixed(1)+'" y="'+(Y(a[a.length-1])-8).toFixed(1)+'" font-size="11" text-anchor="end" fill="var(--ink)" class="num">'+fmt(a[a.length-1],1)+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(s.label)+'">'+g+'</svg><div class="note">Last '+a.length+' observations, ending '+esc(s.asof)+'.</div>'; }

V.method=()=>{ const srcs={}; Object.values(D.sm).forEach(m=>{ const k=m.source||'—'; srcs[k]=(srcs[k]||0)+1; });
  let h=section('Methodology','the machine owns the numbers; the analyst owns the interpretation');
  h+='<div class="grid">'+card('c6','Pipeline','','<div style="font-size:13px"><p>A Google Sheet is the database and the engine. Apps Script fetches every series daily (FRED at 05:00 SGT, after the H.15 release; MAS and OANDA alongside), appends to a single one-row-per-day history, recomputes derived columns, and writes the statistics this page reads. A separate 10-minute job quotes 35 instruments on OANDA against each instrument\'s own previous daily close. This page is a static file that reads the sheet\'s public tabs; it computes nothing that already exists in the sheet.</p><p>Schema version '+esc(D.meta.schema_version||'—')+' · generated '+esc(D.meta.generated_at||'—')+' '+TZ_LABEL+' · last complete run '+esc(D.meta.last_complete||'—')+'.</p></div>')+
    card('c6','Sources','','<table><thead><tr><th>Source</th><th>Series</th><th>Frequency</th></tr></thead><tbody>'+[['FRED','Federal Reserve Bank of St. Louis: Treasury curve (H.15), TIPS, breakevens, Fed funds/SOFR, balance sheet, ICE BofA OAS and yields, H.10 FX, oil, CPI/PCE/claims/payrolls; OECD long-term rates','daily · weekly · monthly'],['MAS','Monetary Authority of Singapore API gateway: SORA fixings and volumes, standing facility corridor, T-bill auction results, SGS benchmarks','daily · per auction'],['OANDA','Daily mid closes (NY 17:00) for gold, silver, copper, BTC, ETH, USDSGD, STI CFD; the live board','daily · 10 min'],['GOOGLEFINANCE','ETF prices for the relative-strength screen','daily']].map(r=>'<tr><td>'+r[0]+'</td><td style="text-align:left;white-space:normal;font-size:12px">'+r[1]+'</td><td style="font-size:12px">'+r[2]+'</td></tr>').join('')+'</tbody></table>')+
    card('c6','Definitions','','<dl class="kv"><dt>Real yield</dt><dd>TIPS constant-maturity yield (FRED DFII*)</dd><dt>Breakeven</dt><dd>Nominal − real for the same tenor, computed in the sheet; the T5YIE/T10YIE prints are shown alongside and a gap over 5bp is flagged</dd><dt>Curve spreads</dt><dd>Long tenor − short tenor, in bp, computed in the sheet with full history</dd><dt>OAS</dt><dd>ICE BofA option-adjusted spread over Treasuries; percentiles over 1y and 3y of the index\'s own history</dd><dt>Net liquidity</dt><dd>Fed balance sheet − Treasury General Account − ON RRP</dd><dt>DXY</dt><dd>Rebuilt from the six ICE basket legs at the published weights (EUR 57.6, JPY 13.6, GBP 11.9, CAD 9.1, SEK 4.2, CHF 3.6)</dd><dt>Policy-rate proxy ◌</dt><dd>6m bill − effective funds and 1y − effective funds. A bill-curve proxy, not a futures- or OIS-implied probability</dd><dt>◌</dt><dd>Marks an estimate or proxy, never a print</dd></dl>')+
    card('c6','Status states','','<dl class="kv"><dt>Fresh</dt><dd>Within its own publication cadence and dated with the freshest series</dd><dt>Behind</dt><dd>Healthy, but dated more than 3 days before the freshest series — do not read it as the same day</dd><dt>Weekly / Monthly</dt><dd>Native frequency; 1w and 1m changes are prior-print based; monthly lines on charts are steps, carried forward between prints</dd><dt>Late</dt><dd>Past its own cadence limit (daily 6d, weekly 18d, monthly 3× cadence + 5d; FX fixes carry a 12-day floor)</dd><dt>Missing</dt><dd>Registered but no observation yet</dd></dl>')+
    card('c12','State rules (Board)','deterministic, from the monthly changes in the sheet','<dl class="kv"><dt>Curve direction</dt><dd>bear if the average of Δ2y and Δ10y over one month exceeds +5bp, bull below −5bp, otherwise sideways</dd><dt>Curve shape</dt><dd>steepening if Δ10y − Δ2y &gt; +5bp, flattening below −5bp, otherwise parallel</dd><dt>Driver</dt><dd>share of |Δreal| in |Δreal| + |Δbreakeven| for the 10y: &gt;60% real-yield driven, &lt;40% breakeven driven, else mixed</dd><dt>Credit</dt><dd>contained if |ΔHY| &lt; 10bp and |ΔIG| &lt; 5bp; HY widening faster than IG if ΔHY &gt; 2×ΔIG</dd><dt>USD</dt><dd>DXY monthly change against the sign of Δ10y</dd><dt>Equities</dt><dd>live S&amp;P change vs previous close, read against the monthly change in the 10y real yield</dd><dt>Liquidity</dt><dd>net liquidity monthly change: draining below −$100bn, adding above +$100bn</dd></dl>')+
    card('c12','Health','per-series coverage from the sheet\'s Health tab','<div id="health">loading…</div>')+'</div>';
  main.innerHTML=h; loadHealth(); };
async function loadHealth(){ const el=document.getElementById('health'); try{ const rows=await tab('Health'); const h=rows[0]; const ix=Object.fromEntries(h.map((k,i)=>[k,i]));
    const body=rows.slice(1).filter(r=>r[0]&&r[0]!=='duplicate_dates'); const late=body.filter(r=>r[ix.status]==='LATE').length, miss=body.filter(r=>r[ix.status]==='MISSING').length;
    let t='<div class="note" style="margin:0 0 6px">'+body.length+' series · '+late+' late · '+miss+' missing'+(rows[1]&&rows[1][9]?' · '+rows[1][9]+' history rows':'')+(rows[1]&&rows[1][8]!=null&&rows[1][8]!==''?' · '+rows[1][8]+' duplicate dates':'')+'</div><div class="scroll" style="max-height:340px;overflow:auto"><table><thead><tr><th>Series</th><th>First</th><th>Last</th><th>Obs</th><th>Coverage</th><th>Cadence d</th><th>Status</th></tr></thead><tbody>';
    body.forEach(r=>{ t+='<tr><td>'+esc(r[0])+'</td><td class="num">'+esc(r[ix.first])+'</td><td class="num">'+esc(r[ix.last])+'</td><td class="num">'+esc(r[ix.obs])+'</td><td class="num">'+esc(r[ix.coverage_pct])+'%</td><td class="num">'+esc(r[ix.cadence_days])+'</td><td>'+statusChip(r[ix.status])+'</td></tr>'; });
    el.innerHTML=t+'</tbody></table></div>'; }catch(e){ el.innerHTML='<div class="note">Health tab not published yet (run healthCheck() in the sheet).</div>'; } }

/* ===================================================================================== provenance modal */
function openProv(id){ const s=S(id), m=D.sm[id]||{}; const el=document.createElement('div'); el.className='modal';
  const src = m.source==='NONE'||!m.source ? 'Computed in the sheet' : m.source+(m.sourceId?' · '+m.sourceId:'')+(m.field?' · '+m.field:'');
  el.innerHTML='<div class="box"><button class="btn x" type="button">Close</button><h3>'+esc(m.label||(s&&s.label)||id)+'</h3><div class="mini">'+esc(id)+'</div>'+
    (s?'<div style="font-size:26px;font-weight:600;margin:6px 0" class="num">'+fmt(s.last,4).replace(/\.?0+$/,'')+' <span class="mini">as of '+esc(s.asof)+'</span></div>':'<div class="note">Not yet in the sheet.</div>')+
    '<dl class="kv"><dt>Source</dt><dd>'+esc(src)+'</dd><dt>Group</dt><dd>'+esc(m.group||'')+'</dd>'+(m.notes?'<dt>Notes</dt><dd>'+esc(m.notes)+'</dd>':'')+(s?'<dt>Cadence</dt><dd>'+(s.cadence==null?'—':s.cadence+' days')+' · '+statusChip(s.status,null)+'</dd><dt>1y range</dt><dd class="num">'+fmt(s.lo,4).replace(/\.?0+$/,'')+' – '+fmt(s.hi,4).replace(/\.?0+$/,'')+' · '+(s.pct==null?'':Math.round(s.pct)+'th percentile')+'</dd>':'')+'</dl>'+
    (s?'<div style="margin-top:8px">'+sparkSvg(s.spark,560,90)+'<div class="note">Last '+s.spark.length+' observations.</div></div>':'')+'</div>';
  document.body.appendChild(el); const close=()=>el.remove(); el.querySelector('.x').addEventListener('click',close); el.addEventListener('click',e=>{ if(e.target===el) close(); }); document.addEventListener('keydown',function k(e){ if(e.key==='Escape'){ close(); document.removeEventListener('keydown',k); } }); }
document.addEventListener('click',e=>{ const p=e.target.closest('[data-prov]'); if(p){ e.preventDefault(); openProv(p.dataset.prov); return; } const d=e.target.closest('[data-drill]'); if(d && !e.target.closest('a')) openProv(d.dataset.drill); });

/* ===================================================================================== tabs / theme / boot */
let cur='board';
function renderTabs(){ document.getElementById('tabs').innerHTML=TABS.map(([k,l])=>'<button role="tab" data-v="'+k+'" aria-selected="'+(k===cur)+'">'+l+'</button>').join(''); }
function show(k){ cur=k; renderTabs(); try{ V[k](); }catch(e){ main.innerHTML='<div class="banner err">Render error on '+esc(k)+': '+esc(e.message)+'</div>'; console.error(e); } if(location.hash!=='#'+k) history.replaceState(null,'','#'+k); window.scrollTo({top:0}); }
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); });
document.getElementById('themeBtn').addEventListener('click',()=>{ const r=document.documentElement; const curT=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); const n=curT==='dark'?'light':'dark'; r.setAttribute('data-theme',n); try{ localStorage.setItem('mm-theme',n); }catch(e){} });
try{ const t=localStorage.getItem('mm-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
document.getElementById('sheetLink').href='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit';

function freshness(){ const ids=Object.keys(D.stats); const late=ids.filter(id=>D.stats[id].status==='LATE').length; const asof=ids.map(id=>D.stats[id].asof).filter(Boolean).sort().pop();
  const gen=D.meta.generated_at||''; document.getElementById('fresh').innerHTML='Data as of <b>'+esc(asof||'—')+'</b>'+(D.hasExt?(late?' · <span class="down">'+late+' of '+ids.length+' series late</span>':' · all '+ids.length+' series within cadence'):'')+(gen?' · sheet refreshed '+esc(gen.slice(0,16))+' '+TZ_LABEL:'')+(D.liveMeta.refreshed?' · live '+esc(D.liveMeta.refreshed.slice(11,16)):''); }
async function boot(){ const banner=document.getElementById('banner');
  try{
    const [st, ds, lv, rl, nt, mt, sm] = await Promise.all([tab('DashStats'), tab('DashSeries'), tab('Live').catch(()=>null), tab('RatiosLatest').catch(()=>null), tab('Notes').catch(()=>null), tab('Meta').catch(()=>null), tab('Series').catch(()=>null)]);
    loadStats(st); loadSeries(ds); if(lv) loadLive(lv); if(rl) loadRatios(rl); if(nt) loadNotes(nt); if(mt) loadMeta(mt); if(sm) loadSeriesMeta(sm);
    if(mt && D.meta.schema_version!==SCHEMA_VERSION){ banner.innerHTML='<div class="banner err">Sheet schema is v'+esc(D.meta.schema_version)+', this page expects v'+SCHEMA_VERSION+'. Refusing to render until they match.</div>'; return; }
    if(!mt) banner.innerHTML='<div class="banner">The sheet has not published a Meta tab yet (v5 not deployed). Showing what exists; new panels will fill in after the v5 cut-over.</div>';
    freshness();
    const h=location.hash.replace('#',''); show(TABS.some(t=>t[0]===h)?h:'board');
    document.getElementById('foot').innerHTML='Sources: FRED (Federal Reserve Bank of St. Louis), OECD via FRED, Monetary Authority of Singapore, OANDA, Google Finance. Items marked ◌ are proxies or estimates, not prints. Nothing here is investment advice. Data sheet, code and tests: <a href="https://github.com/evanlai2805/markets-dashboard" target="_blank" rel="noopener">github.com/evanlai2805/markets-dashboard</a>.';
    setInterval(async()=>{ try{ const rows=await tab('Live'); D.live={}; loadLive(rows); freshness(); if(cur==='board'||cur==='cmdty'||cur==='equities'||cur==='fx') show(cur); }catch(e){} }, LIVE_REFRESH_MS);
  }catch(e){ banner.innerHTML='<div class="banner err">Could not load the data sheet: '+esc(e.message)+'. If the sheet is public and the tabs exist, retry in a minute.</div>'; console.error(e); }
}
boot();
})();
